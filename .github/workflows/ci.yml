name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python -m py_compile azctl.py
      - name: Installer syntax (sh)
        run: sh -n install.sh
      - name: Installer syntax (PowerShell)
        # GitHub-hosted ubuntu runners ship pwsh; if that ever changes, skip
        # rather than fail -- sh -n above already covers the other installer.
        run: |
          if command -v pwsh >/dev/null; then
            pwsh -NoProfile -Command "\$e = \$null; [void][System.Management.Automation.Language.Parser]::ParseFile('install.ps1', [ref]\$null, [ref]\$e); \$e | ForEach-Object { \$_.Message }; exit ([bool]\$e)"
          else
            echo "pwsh not available on this runner; skipped"
          fi
      - name: Ruff
        # Pinned: new ruff releases have flipped default rule sets before,
        # and an unpinned lint tool fails CI the day that happens.
        run: |
          pip install ruff==0.15.22
          ruff check azctl.py tests/

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test deps
        run: pip install pytest pytest-asyncio textual psutil
      - name: Run tests
        run: pytest -q

  bootstrap-smoke:
    name: Cold-start bootstrap smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Azurite
        run: npm install -g azurite
      - name: Status snapshot on a machine with no deps installed
        run: python azctl.py status
      - name: JSON status
        run: python azctl.py status --json
